# One-time helper: unpacks roboverse-source.tar.gz (uploaded via the web UI) into the repository
# root as a normal commit, then removes the archive. Delete this file afterwards.
name: bootstrap-unpack-source
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          test -f roboverse-source.tar.gz
          tar xzf roboverse-source.tar.gz
          git rm -q roboverse-source.tar.gz
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add ROBOVERSE source (frontend, backend, documentation, scripts)"
          git push
